[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain_opt"
version = "0.3.0"
description = "BrainLab optimizers, federated simulators and parameter-efficient language model training."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "BrainLab" }
]
keywords = ["pytorch", "optimizer", "federated-learning", "fedavg", "muon", "shampoo", "soap", "lion", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Only torch.linalg.{svd,eigh,qr} is required, available since torch 1.8.
    # We set the floor at 1.10 to match the practical baseline of modern projects.
    "torch>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
training = ["torch>=2.1", "transformers>=4.43", "peft>=0.11", "accelerate>=0.30"]

[project.scripts]
brain-opt = "brain_opt.cli:main"

[project.urls]
Homepage = "https://github.com/Vepricov/brain-opt"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain_opt*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
markers = ["platform_mock: contract checks with mocked PlatformAPI, not a live platform run"]
